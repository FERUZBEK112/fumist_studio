name: FUMIST mobile packages
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-packages.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m unittest discover -v
      - run: |
          for file in static/{app,i18n}.js static/mobile-releases/1.3.2/{app,i18n}.js; do
            node --input-type=module --check < "$file"
          done
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p mobile/android assembleDebug && cp mobile/android/build/outputs/apk/debug/*.apk FUMIST-Studio-1.3.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FUMIST-Studio-Android
          path: FUMIST-Studio-1.3.2.apk
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify editor opens in the Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash mobile/android/check-launch.sh
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: |
          command -v xcodegen || brew install xcodegen
          cd mobile/ios
          sips -z 1024 1024 -s format png ../android/src/main/res/drawable-nodpi/studio_icon.jpg --out Assets.xcassets/AppIcon.appiconset/icon.png
          xcodegen generate
          xcodebuild -project FumistStudio.xcodeproj -scheme FumistStudio -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FumistStudio.app Payload/
          zip -qr FUMIST-Studio-1.3.2-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FUMIST-Studio-iOS-unsigned
          path: mobile/ios/FUMIST-Studio-1.3.2-unsigned.ipa
      - name: Verify editor opens in the iPhone app
        working-directory: mobile/ios
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group,ds in reversed(list(json.load(sys.stdin)["devices"].items())) if ".iOS-" in group for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild -project FumistStudio.xcodeproj -scheme FumistStudio -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO test
