name: FumistStudio
targets:
  FumistStudio:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Studio.swift, Assets.xcassets]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: uz.fumist.studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FUMIST Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Import a video or photo into your project.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record sound with a captured video.
        MARKETING_VERSION: 1.3.1
        CURRENT_PROJECT_VERSION: 10302
        SWIFT_VERSION: "5.0"
